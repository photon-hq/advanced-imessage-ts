syntax = "proto3";

package photon.imessage.v1;

option swift_prefix = "PIMsg_";


enum ChatServiceType {

  CHAT_SERVICE_TYPE_UNSPECIFIED = 0;
  CHAT_SERVICE_TYPE_IMESSAGE = 1;
  CHAT_SERVICE_TYPE_SMS = 2;
  CHAT_SERVICE_TYPE_RCS = 3;

}


// An address bound to one concrete transport service. Used when the server
// must identify a specific (handle, service) pair — message sender, chat
// participant, etc.
message SingleServiceAddressInfo {

  string address = 1;

  ChatServiceType service = 2;

  optional string country = 3;

}


// An address paired with every service it has been observed on.
//
// `services` is emitted in canonical (iMessage, SMS, RCS) order. Clients
// should treat it as a set, not a sequence. Always non-empty when this
// message is returned — an address with no observed services produces
// NOT_FOUND instead.
message MultiServiceAddressInfo {

  // Canonical form: emails lowercased, phones E.164. May differ from the
  // request value's casing or whitespace.
  string address = 1;

  repeated ChatServiceType services = 2;

  // ISO 3166-1 alpha-2, uppercased (e.g. "US"). Absent when chat.db has no
  // country for this address.
  optional string country = 3;

}
