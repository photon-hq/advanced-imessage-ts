syntax = "proto3";

package photon.imessage.v1;

import "google/protobuf/timestamp.proto";

option swift_prefix = "PIMsg_";


// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------

// Source / freshness of a friend's location, mirroring Apple's
// `FMFLocationType`:
//
//   LEGACY   stored last-known fix from Find My's cache
//   LIVE     real-time fix from an active sharing session
//   SHALLOW  approximate fix from a low-power background source
enum FriendLocationType {

  FRIEND_LOCATION_TYPE_UNSPECIFIED = 0;

  FRIEND_LOCATION_TYPE_LEGACY = 1;

  FRIEND_LOCATION_TYPE_LIVE = 2;

  FRIEND_LOCATION_TYPE_SHALLOW = 3;

}


// A single currently shared friend location. Coordinates are absent while the
// device is acquiring a fix (`is_locating_in_progress = true`).
message SharedFriendLocation {

  // Canonical handle (E.164 phone or full email). Primary key for
  // client-side correlation.
  string address = 1;

  optional string name = 2;

  optional double latitude = 3;

  optional double longitude = 4;

  // Horizontal accuracy in meters.
  optional double accuracy = 5;

  // Fully formatted reverse-geocoded address (e.g. street + city + region).
  optional string long_address = 6;

  // Compact reverse-geocoded label (e.g. neighborhood or city only).
  optional string short_address = 7;

  bool is_locating_in_progress = 8;

  FriendLocationType location_type = 9;

  optional google.protobuf.Timestamp location_timestamp = 10;

  optional google.protobuf.Timestamp expires_at = 11;

}


// Single live update pushed by `Watch*` streams.
message SharedFriendLocationUpdated {

  // Monotonic per-process sequence for this transient live feed. Gaps mean
  // the subscriber missed frames within the session; replay is not available.
  uint64 source_sequence = 1;

  SharedFriendLocation location = 2;

}
