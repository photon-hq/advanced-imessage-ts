syntax = "proto3";

package photon.imessage.v1;

import "photon/imessage/v1/address_types.proto";
import "google/protobuf/timestamp.proto";

option swift_prefix = "PIMsg_";


// ---------------------------------------------------------------------------
// Change variants
// ---------------------------------------------------------------------------

message GroupDisplayNameChanged {

  string display_name = 1;

}


message GroupParticipantAdded {

  SingleServiceAddressInfo participant = 1;

}


// Participant removed by another member (kicked). The actor on the
// envelope is the remover, distinct from `participant`.
message GroupParticipantRemoved {

  SingleServiceAddressInfo participant = 1;

}


// Participant voluntarily left the group. The actor on the envelope and
// `participant` are the same.
message GroupParticipantLeft {

  SingleServiceAddressInfo participant = 1;

}


// Icon mutations carry no payload. Fetch the new bytes via
// `GroupService.GetIcon` after observing the event.
message GroupIconChanged {}
message GroupIconRemoved {}


// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

// A discrete state transition observed for a group chat.
//
// `actor` is the participant whose action produced the change; absent when
// Apple's stack does not surface one (e.g. icon mutations from the local
// device).
message GroupChangeEvent {

  string chat_guid = 1;

  google.protobuf.Timestamp occurred_at = 2;

  optional SingleServiceAddressInfo actor = 3;

  bool is_from_me = 4;

  oneof change {

    GroupDisplayNameChanged display_name_changed = 10;

    GroupParticipantAdded participant_added = 11;

    GroupParticipantRemoved participant_removed = 12;

    GroupParticipantLeft participant_left = 13;

    GroupIconChanged icon_changed = 14;

    GroupIconRemoved icon_removed = 15;

  }

}
