syntax = "proto3";

package photon.imessage.v1;

import "photon/imessage/v1/address_types.proto";
import "google/protobuf/timestamp.proto";

option swift_prefix = "PIMsg_";


// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------

// One option in a poll. `option_identifier` is Apple's stable opaque ID;
// `creator_handle` is the participant who introduced the option (poll
// creator for original options, voter address for added options).
message PollOption {

  string text = 1;

  string option_identifier = 2;

  optional string creator_handle = 3;

}


// One selected option in a participant's current vote snapshot.
message PollParticipantVote {

  SingleServiceAddressInfo participant = 1;

  string option_identifier = 2;

}


// Full poll snapshot.
message PollInfo {

  string poll_message_guid = 1;

  string chat_guid = 2;

  string title = 3;

  repeated PollOption options = 4;

  repeated PollParticipantVote votes = 5;

}


// ---------------------------------------------------------------------------
// Change variants
// ---------------------------------------------------------------------------

// Initial poll creation. `options` is the full option set as posted;
// later additions arrive as `PollOptionAdded`.
message PollCreated {

  string title = 1;

  repeated PollOption options = 2;

}


// New option appended to an existing poll. `options` is the *complete*
// option set after insertion (not the delta) so consumers can replace
// state directly.
message PollOptionAdded {

  string title = 1;

  repeated PollOption options = 2;

}


// A participant voted for one option. The participant is carried by the
// enclosing event actor.
message PollVoted {

  string option_identifier = 1;

}


// A participant deselected one option. The participant is carried by the
// enclosing event actor.
message PollUnvoted {

  string option_identifier = 1;

}


// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

// A discrete state transition observed for a poll.
message PollChangeEvent {

  string chat_guid = 1;

  string poll_message_guid = 2;

  google.protobuf.Timestamp occurred_at = 3;

  optional SingleServiceAddressInfo actor = 4;

  bool is_from_me = 5;

  oneof change {

    PollCreated created = 10;

    PollOptionAdded option_added = 11;

    PollVoted voted = 12;

    PollUnvoted unvoted = 13;

  }

}
