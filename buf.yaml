version: v2
# proto/ MIRRORS advanced-imessage-server-v2's proto/public — the canonical
# home of the contract, whose CI publishes it to the BSR as
# buf.build/photon-hq/imessage. Deliberately NO module name here: this repo
# must never `buf push`. Keep changes flowing v2 → here, never the reverse.
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # Mirror of the exceptions in advanced-imessage-server-v2/buf.yaml (the
    # v1 contract deliberately shares response types and zero-valued enums).
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - ENUM_ZERO_VALUE_SUFFIX
